; wM-Buster ADV — PlatformIO configuration
; Target: M5Stack Cardputer-ADV (ESP32-S3FN8, 8 MB flash, no PSRAM)
;         + Cap LoRa-1262 (SX1262) or Hydra RF (CC1101)
;
; Host tests (no hardware needed):  make -C test/host
; UI screenshots on a PC:           make -C test/ui_preview

[platformio]
default_envs = m5stack-cardputer-adv

[env:m5stack-cardputer-adv]
platform = espressif32@6.10.0
board = m5stack-stamps3
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 8 MB flash with two OTA slots (web firmware update)
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

; web/index.html -> src/net/web_page.h (gzip)
extra_scripts =
    pre:tools/embed_web.py
    post:tools/merge_bin.py

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    ; only the SX126x driver of RadioLib is used
    -D RADIOLIB_EXCLUDE_CC1101=1
    -D RADIOLIB_EXCLUDE_NRF24=1
    -D RADIOLIB_EXCLUDE_RF69=1
    -D RADIOLIB_EXCLUDE_SX1231=1
    -D RADIOLIB_EXCLUDE_SI443X=1
    -D RADIOLIB_EXCLUDE_RFM2X=1
    -D RADIOLIB_EXCLUDE_SX127X=1
    -D RADIOLIB_EXCLUDE_SX128X=1
    -D RADIOLIB_EXCLUDE_LR11X0=1
    -D RADIOLIB_EXCLUDE_AFSK=1
    -D RADIOLIB_EXCLUDE_AX25=1
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
    -D RADIOLIB_EXCLUDE_MORSE=1
    -D RADIOLIB_EXCLUDE_RTTY=1
    -D RADIOLIB_EXCLUDE_SSTV=1
    -D RADIOLIB_EXCLUDE_BELL=1
    -D RADIOLIB_EXCLUDE_APRS=1
    -D RADIOLIB_EXCLUDE_LORAWAN=1
    -D RADIOLIB_EXCLUDE_FSK4=1
    -D RADIOLIB_EXCLUDE_PAGER=1
    -I include

; exact versions, so every build (and every release) uses the tested libraries
lib_deps =
    m5stack/M5Unified @ 0.2.23
    m5stack/M5GFX @ 0.2.30
    m5stack/M5Cardputer @ 1.2.0
    jgromes/RadioLib @ 7.7.1
    https://github.com/m5stack/TinyGPSPlus.git#254a10041ac38d17d98dab24c0ae4d2a8d19a677
    knolleary/PubSubClient @ 2.8
